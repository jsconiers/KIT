# Kit's automated checks.
#   checks:          syntax for the shell, Python, and PowerShell, job templates and JSON, a scan for
#                    personal details (patterns in the SCAN_PATTERNS secret), the owner-name test, and
#                    the letter builder test.
#                    See .github/scripts/checks.py.
#   windows-install: the Windows installer, run for real on GitHub's Windows runners under Windows
#                    PowerShell 5.1 and PowerShell 7: install, reinstall, and the repair of an install
#                    whose files lost their permissions. See .github/scripts/windows-install-test.ps1.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run Kit's checks
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: python3 .github/scripts/checks.py
      - name: Owner name test
        run: python3 tests/test_owner_name.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Letter builder test
        run: |
          python -m pip install --quiet python-docx
          python tests/test_kit_letter.py

  windows-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Owner name test
        run: python tests/test_owner_name.py
      - name: Letter builder test
        run: |
          python -m pip install --quiet python-docx
          python tests/test_kit_letter.py
      - name: Install, reinstall, and repair
        env:
          KIT_OWNER: Testy
        run: .\.github\scripts\windows-install-test.ps1
