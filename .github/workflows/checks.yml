# Kit's automated checks.
#   checks:          syntax for the shell, Python, and PowerShell, job templates and JSON, a scan for
#                    personal details (patterns in the SCAN_PATTERNS secret), the owner-name test, the
#                    connector guard's fail-closed launch (kit-hook), the credential lookup doctor and
#                    kit-connect share, kit-mcp-env (MCP servers' tokens from the Keychain), kit-update
#                    (reinstall, landed patches, release zips), the end-of-day wrap and review rehearsal tests, the vendor desk,
#                    team coverage map, and architecture digest tests, the letter builder test, and the 1.7.0
#                    sprint's tests (health score, review loop page, monthly report, traceability workbook,
#                    token expiry, ticket watcher, MCP watchdog, kit-release).
#                    See .github/scripts/checks.py.
#   windows-install: the Windows installer, run for real on GitHub's Windows runners under Windows
#                    PowerShell 5.1 and PowerShell 7: install, reinstall, and the repair of an install
#                    whose files lost their permissions (.github/scripts/windows-install-test.ps1, with
#                    the connector guard's installed hooks run in Git Bash), the guard launcher's tests
#                    in Git Bash (tests/test_kit_hook.py), the credential lookup and kit-mcp-env against the
#                    real Credential Manager (tests/test_credentials.py, tests/test_mcp_env.py), kit-update
#                    with install.ps1 (tests/test_kit_update.py, tests/test_kit_update_zip.py), the PPM Express connector's tests
#                    on Windows (Credential Manager, the pulse, and meeting actions included), the wrap,
#                    rehearsal, vendor desk, team map, and digest tests, and the Windows fixes tests
#                    (tests/test_windows_fixes.py, with python-docx).
#   ppmx:            the PPM Express MCP server (shared/ppmx): its tests against a fake PPM Express (the
#                    tools, and kit-ppmx's pulse and meeting actions: tests/test_ppmx_work.py), the
#                    OpenShift files rendered with kustomize, and the container image built and run the
#                    way OpenShift runs it (a random non-root user, a read-only root filesystem, no
#                    capabilities). See tests/test_ppmx.py and tests/ppmx_container_smoke.py.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run Kit's checks
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: python3 .github/scripts/checks.py
      - name: Owner name test
        run: python3 tests/test_owner_name.py
      - name: Connector guard launcher tests (kit-hook)
        run: python3 tests/test_kit_hook.py
      - name: Credential lookup tests (doctor and kit-connect)
        run: python3 tests/test_credentials.py
      - name: kit-mcp-env tests (MCP servers' tokens from the credential store)
        run: python3 tests/test_mcp_env.py
      - name: Health check tests (setup paths, MCP launch setup)
        run: |
          python3 tests/test_setup_paths.py
          python3 tests/test_mcp_launch.py
      - name: kit-review-loop tests (merge, feedback, and the readiness score offline, run with a fake claude)
        run: python3 tests/test_review_loop.py
      - name: Review loop page, dashboard Reviews panel, and health badge tests
        run: |
          python3 tests/test_review_ui.py
          python3 tests/test_health_score.py
      - name: Sprint tools tests (monthly report, traceability workbook, token expiry, ticket watcher, MCP watchdog, release)
        run: |
          python3 tests/test_wins_month.py
          python3 tests/test_trace_xlsx.py
          python3 tests/test_expiry_tokens.py
          python3 tests/test_tickets.py
          python3 tests/test_mcp_watch.py
          python3 tests/test_release.py
          python3 tests/test_signoff.py
          python3 tests/test_tradeinsights.py
          python3 tests/test_docs_package.py
          python3 tests/test_owner_allow.py
      - name: Consistency checks, precedent, drift, setup wizard, docs builder, and review drafts tests
        run: |
          python3 tests/test_diagtext.py
          python3 tests/test_dedupe.py
          python3 tests/test_facts.py
          python3 tests/test_precedent_closest.py
          python3 tests/test_drift.py
          python3 tests/test_setup_questions.py
          python3 tests/test_kit_docs.py
          python3 tests/test_selfeval.py
          python3 tests/test_360.py
          python3 tests/test_timeoff.py
      - name: kit-update tests (reinstall when the install lags; landed patches with rebuilt documents)
        run: python3 tests/test_kit_update.py
      - name: kit-update zip tests (release zips checked as untrusted, installed, kept, pruned)
        run: python3 tests/test_kit_update_zip.py
      - name: End-of-day wrap and review rehearsal tests
        run: |
          python3 tests/test_wrap.py
          python3 tests/test_rehearse.py
      - name: Vendor desk, team coverage map, and architecture digest tests
        run: |
          python3 tests/test_vendors.py
          python3 tests/test_teammap.py
          python3 tests/test_digest.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Letter builder test
        run: |
          python -m pip install --quiet python-docx
          python tests/test_kit_letter.py

  windows-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Owner name test
        run: python tests/test_owner_name.py
      - name: Letter builder test
        run: |
          python -m pip install --quiet python-docx
          python tests/test_kit_letter.py
      - name: Install, reinstall, and repair
        env:
          KIT_OWNER: Testy
        run: .\.github\scripts\windows-install-test.ps1
      - name: Connector guard launcher tests on Windows (kit-hook in Git Bash)
        run: python tests/test_kit_hook.py
      - name: Credential lookup tests on Windows (Credential Manager, for real)
        run: python tests/test_credentials.py
      - name: kit-mcp-env tests on Windows (Credential Manager, for real)
        run: python tests/test_mcp_env.py
      - name: Setup paths health check tests on Windows
        run: python tests/test_setup_paths.py
      - name: MCP launch health check tests on Windows
        run: python tests/test_mcp_launch.py
      - name: kit-review-loop tests on Windows
        run: python tests/test_review_loop.py
      - name: kit-update tests on Windows (install.ps1 stand-in)
        run: python tests/test_kit_update.py
      - name: kit-update zip tests on Windows (install.ps1 stand-in)
        run: python tests/test_kit_update_zip.py
      # One test per step: PowerShell fails a step only on its last command's exit code.
      - name: PPM Express MCP tests on Windows
        run: python tests/test_ppmx.py
      - name: PPM Express pulse and meeting actions tests on Windows
        run: python tests/test_ppmx_work.py
      - name: End-of-day wrap tests on Windows
        run: python tests/test_wrap.py
      - name: Vendor desk tests on Windows
        run: python tests/test_vendors.py
      - name: Team coverage map tests on Windows
        run: python tests/test_teammap.py
      - name: Architecture digest tests on Windows
        run: python tests/test_digest.py
      - name: Review rehearsal tests on Windows
        run: python tests/test_rehearse.py
      # python-docx is pinned; check it for advisories before changing the version.
      - name: Windows fixes tests on Windows (python-docx for kit-library's Word file)
        run: |
          python -m pip install --quiet python-docx==1.1.2
          python tests/test_windows_fixes.py

  ppmx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PPM Express MCP tests
        run: |
          python tests/test_ppmx.py
          python tests/test_ppmx_work.py
      - name: OpenShift files render
        run: kubectl kustomize shared/ppmx/openshift > /dev/null
      - name: Build the standalone image
        run: docker build -f shared/ppmx/Containerfile -t ppmx-mcp:ci .
      - name: Run it the way OpenShift does, against a fake PPM Express
        run: python tests/ppmx_container_smoke.py --image ppmx-mcp:ci
