# The standalone PPM Express MCP server on OpenShift (INSTALL.md, next to this, has every step). Fill in the
# REPLACE values (the namespace, the image, your tenant's API address in configmap.yaml), then:
#
#   oc apply -k shared/ppmx/openshift          (or kubectl kustomize shared/ppmx/openshift to see it first)
#
# Nothing here holds a token: each caller sends their own personal access token with every request.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: REPLACE-namespace
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
images:
  - name: ppmx-mcp
    newName: REPLACE-registry/REPLACE-namespace/ppmx-mcp
    newTag: "0.2.0"
