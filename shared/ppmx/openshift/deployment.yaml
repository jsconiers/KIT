apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppmx-mcp
  labels:
    app.kubernetes.io/name: ppmx-mcp
    app.kubernetes.io/part-of: kit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ppmx-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ppmx-mcp
        app.kubernetes.io/part-of: kit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ppmx-mcp
          image: ppmx-mcp
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ppmx-mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
